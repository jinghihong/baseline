name: Refresh open data

# Pulls the latest NYC Open Data and Grants.gov snapshots every Monday, commits them if anything changed,
# and redeploys the site. Run it by hand from the Actions tab at any time.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch datasets
        # A failed source keeps its previous snapshot; the job still commits whatever refreshed.
        run: node scripts/fetch-data.mjs || echo "::warning::Some datasets failed to refresh; previous snapshots were kept."
      - id: commit
        name: Commit changes
        run: |
          if git diff --quiet -- public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "baseline-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh open data snapshots"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
